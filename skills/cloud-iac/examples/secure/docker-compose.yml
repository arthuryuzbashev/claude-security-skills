services:
  app:
    image: registry.example.test/app:2.3.1
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
  db:
    image: postgres:16.2
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
secrets:
  db_password:
    file: ./db_password.txt
