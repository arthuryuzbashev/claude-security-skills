apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels:
        app: web
    spec:
      hostNetwork: true
      containers:
        - name: web
          image: registry.example.test/web:latest
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: info
            - name: API_TOKEN
              value: "tok_FAKE_0123456789abcdef"   # example only
          securityContext:
            privileged: true
            runAsUser: 0
        - name: sidecar
          image: busybox
          command: ["sh", "-c", "tail -f /host/var/log/syslog"]
          volumeMounts:
            - name: host-logs
              mountPath: /host/var/log
      volumes:
        - name: host-logs
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-deployer
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anyone-can-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: system:unauthenticated
    apiGroup: rbac.authorization.k8s.io
