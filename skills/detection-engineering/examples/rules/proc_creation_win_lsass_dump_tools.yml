title: LSASS Memory Dump With comsvcs.dll or ProcDump
id: b3d3e21e-67ea-4df4-8a99-6af371bcc50d
status: test
description: Detects the comsvcs.dll MiniDump export run through rundll32 and ProcDump pointed at lsass, two common ways to dump credentials from LSASS memory.
author: Aegis example
date: 2026-11-19
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_comsvcs:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  selection_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  condition: 1 of selection_*
falsepositives:
  - Support staff capturing a crash dump of lsass on request from Microsoft (rare, should be ticketed)
level: critical
