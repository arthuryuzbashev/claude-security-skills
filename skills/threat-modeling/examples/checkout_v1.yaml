# Example system: a small online shop checkout (fake hosts, example.test only)
name: Shop checkout v1
zones:
  internet: 0
  dmz: 1
  app: 2
  data: 3
  third-party: 0
components:
  - id: shopper
    name: Shopper
    type: user
    zone: internet
  - id: web
    name: Storefront (shop.example.test)
    type: web
    zone: dmz
    logging: yes
  - id: api
    name: Orders API
    type: api
    zone: app
    logging: yes
  - id: db
    name: Orders DB
    type: db
    zone: data
    logging: yes
  - id: psp
    name: Payment provider
    type: external
    zone: third-party
flows:
  - id: browse
    from: shopper
    to: web
    protocol: https
    auth: none
    data: public
  - id: checkout
    from: shopper
    to: web
    protocol: https
    auth: session
    data: [pii, payment]
  - id: web-api
    from: web
    to: api
    protocol: https
    auth: mtls
    data: pii
  - id: api-db
    from: api
    to: db
    protocol: postgres+tls
    auth: password
    data: pii
  - id: pay
    from: api
    to: psp
    protocol: https
    auth: apikey
    data: payment
