name: PR preview
on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions: write-all

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  preview:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-org/setup-toolchain@main
      - uses: example-dev/deploy-preview@v2.1.0
      - name: Greet
        run: |
          echo "Building PR: ${{ github.event.pull_request.title }}"
          echo "Branch ${{ github.head_ref }}"
      - name: Install helper
        run: curl -fsSL https://get.example.test/install.sh | bash
      - name: Debug
        run: echo "token is ${{ secrets.DEPLOY_TOKEN }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ github.event.comment.body }}`
            console.log(body)
